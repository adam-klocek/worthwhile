name: App and isolation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  r-tests:
    runs-on: ubuntu-latest
    env:
      WORTHWHILE_MODE: local
      WORTHWHILE_STATE_FILE: ""
      PORTFOLIO_STATE_FILE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native HTTP dependency headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev
      - name: Restore dependencies and test
        run: Rscript -e 'install.packages("renv", repos="https://cloud.r-project.org"); renv::restore(prompt=FALSE); renv::load(); source("tests/run-all.R")'
      - name: Theme and JavaScript checks
        run: |
          node tests/check-assets.js
          node --check www/app.js
          node --check www/auth.js
  sql-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: worthwhile_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Test schema and user isolation in a disposable database
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -h localhost -U postgres -d worthwhile_test -v ON_ERROR_STOP=1 -f supabase/tests/000_auth_fixture.sql
          psql -h localhost -U postgres -d worthwhile_test -v ON_ERROR_STOP=1 -f supabase/migrations/001_private_plans.sql
          psql -h localhost -U postgres -d worthwhile_test -v ON_ERROR_STOP=1 -f supabase/tests/002_isolation.sql
